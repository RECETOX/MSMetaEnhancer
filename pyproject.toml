[project]
name = "msmetaenhancer"
version = "0.6.1"
description = "Repository for tool that adds more annotations (e.g. SMILES, InChI, CAS number) to MSP files (Python version)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Helge Hecht", email = "helge.hecht@recetox.muni.cz" },
    { name = "Matej Trojak", email = "matej.trojak@recetox.muni.cz" },
]
dependencies = [
    "matchms>=0.30.0",
    "pandas>=2.2.1,<3.0",
    "scipy>=1.12.0,<2.0",
    "requests>=2.31.0,<3.0",
    "aiohttp>=3.9.3,<4.0",
    "asyncstdlib>=3.12.0,<4.0",
    "frozendict>=2.4.0,<3.0",
    "twine>=5.0.0,<6.0",
    "tabulate>=0.9.0,<0.10.0",
    "rdkit>=2024.3.5,<2025.0.0",
    "multidict>=6.0.5,<7.0",
    "aiocircuitbreaker>=2.0.0,<3.0",
    "openpyxl>=3.1.2,<4.0",
]

[dependency-groups]
dev = [
    "mock>=5.1.0,<6.0",
    "pytest>=8.0.2,<9.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=4.1.0,<5.0",
    "pytest-aiohttp>=1.0.5,<2.0",
    "pytest-dependency>=0.6.0,<0.7.0",
    "ruff>=0.11.13,<0.12.0",
    "pre-commit>=4.2.0,<5.0",
    "flake8>=7.2.0,<8.0",
]
docs = [
    "sphinx>=7.2.6,<8.0",
    "sphinx-rtd-theme>=2.0.0,<3.0",
    "readthedocs-sphinx-ext>=2.2.5,<3.0",
    "myst-parser>=2.0.0,<3.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"

[tool.uv.build-backend]
module-name = "MSMetaEnhancer"
module-root = ""
